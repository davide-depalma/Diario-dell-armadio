/* ================= VISTA: VESTIMI ================= */
/* Capi disponibili: quelli che non hai tolto nella scelta prima delle proposte (in lavatrice, prestati, in valigia…) */
function unavailSet(){ return new Set((S.settings&&S.settings.unavail)||[]); }
function isAvail(i, U){ return !(U||unavailSet()).has(i.id); }
function availItems(){ const U=unavailSet(); return activeItems().filter(i=>isAvail(i,U)); }
function poolFor(slot, ctx){
  return availItems().filter(i=>slot.cats.includes(i.cat))
    .filter(i=>seasonsOf(i).includes(ctx.season))
    .filter(i=>!ctx.occasion || !(i.occasions&&i.occasions.length) || i.occasions.includes(ctx.occasion));
}
function harmony(items){
  const fam=new Set(); let pattern=0;
  for(const it of items){ for(const c of (it.colors||[]).slice(0,2)){ if(c==='fantasia'){pattern++; continue;} const k=COL[c]; if(!k||k.neutral) continue; fam.add(COLOR_FAMILY[c]||c); } }
  let score=3 - Math.max(0,fam.size-2)*1.6 - (fam.size===2?0.4:0) - (pattern>1?2.2:0) - (pattern===1&&fam.size>1?0.6:0);
  const label = pattern>1 ? 'Troppe fantasie insieme' : fam.size===0 ? 'Tutto su toni neutri' : fam.size===1 ? 'Un colore protagonista' : fam.size===2 ? 'Due colori in contrasto' : 'Molti colori: look audace';
  return {score,label};
}
function dressCtx(){ const d=UI.dress; const season=d.season||currentSeason(); return {season, occasion:d.occasion, forgotten:d.forgotten}; }
function generateDress(onlySlot){
  const d=UI.dress, ctx=dressCtx(), W=wearIndex(), today=todayStr(), RU=SEASON_RULES[ctx.season];
  const seen=d.mixSeen||(d.mixSeen={});
  // rotazione: i capi già usciti nelle ultime mescolate pesano meno, così prima o poi escono tutti
  const weight=i=>{ let k=1/(1+(seen[i.id]||0)*0.8);
    if(d.prio==='poco'){ const w=W[i.id]; k*= (usoOf(i)==='mai'?3:usoOf(i)==='qualche'?1.8:1) * (!w?2:1+Math.min(3, daysBetween(w.last,today)/30)); }
    else if(d.prio==='spesso') k*= usoOf(i)==='spesso'?3:usoOf(i)==='qualche'?1.6:1;
    return k; };
  const pick=pool=>{ if(!pool.length) return null; const tot=pool.reduce((s,i)=>s+weight(i),0); let r=Math.random()*tot; for(const i of pool){ r-=weight(i); if(r<=0) return i.id; } return pool[pool.length-1].id; };
  const pools=Object.fromEntries(SLOTS.map(s=>[s.id,poolFor(s,ctx)]));
  const chance=(rule,p)=> rule==='si' ? true : rule==='opt' ? Math.random()<p : false;
  let best=null;
  for(let t=0;t<40;t++){
    const c={};
    for(const s of SLOTS) if(d.locks[s.id] && d.slots[s.id]) c[s.id]=d.slots[s.id];
    if(onlySlot){ for(const s of SLOTS) if(s.id!==onlySlot && d.slots[s.id]) c[s.id]=d.slots[s.id]; }
    const want=s=>!c[s] && (!onlySlot || onlySlot===s);
    const sepOk=(pools.top.length||pools.maglia.length)&&pools.sotto.length, dressOk=pools.vestito.length;
    let useDress = c.vestito ? true : (c.top||c.sotto||c.maglia) ? false : (dressOk && (!sepOk || Math.random() < pools.vestito.length/(pools.vestito.length+pools.sotto.length*1.5)));
    if(onlySlot) useDress=!!c.vestito || onlySlot==='vestito';
    if(useDress){ if(want('vestito')) c.vestito=pick(pools.vestito); if(!onlySlot){ delete c.top; delete c.sotto; } }
    else {
      if(want('maglia') && (onlySlot==='maglia' || chance(RU.maglia,0.55))) c.maglia=pick(pools.maglia);
      if(want('top') && (onlySlot==='top' || RU.base==='si' || (RU.base==='opt' && (!c.maglia || Math.random()<0.5)))) c.top=pick(pools.top);
      if(!c.top && !c.maglia){ c.top=pick(pools.top) || null; if(!c.top) c.maglia=pick(pools.maglia); }
      if(want('sotto')) c.sotto=pick(pools.sotto);
      if(!onlySlot) delete c.vestito;
    }
    if(want('capispalla') && (onlySlot==='capispalla' || chance(RU.outer,0.5))) c.capispalla=pick(pools.capispalla);
    if(want('scarpe')) c.scarpe=pick(pools.scarpe);
    if(want('borsa') && (Math.random()<.55 || onlySlot)) c.borsa=pick(pools.borsa);
    if(want('accessorio') && (Math.random()<.4 || onlySlot)) c.accessorio=pick(pools.accessorio);
    for(const k in c) if(!c[k]) delete c[k];
    const items=Object.values(c).map(id=>S.items[id]).filter(Boolean);
    const sc=styleScore(items,Object.assign({target:null},ctx),W).s*0.5 + Math.random()*1.2 + items.reduce((s,i)=>s+weight(i),0)/Math.max(1,items.length)*0.9;
    if(!best||sc>best.sc) best={c,sc};
    if(onlySlot) break;
  }
  d.slots=best?best.c:{};
  for(const id of Object.values(d.slots)) seen[id]=(seen[id]||0)+1;
}
</script>
<script>
"use strict";
/* ================= STILISTA: regole di stile ================= */
const FORM_KW = [
  [0,/(tuta|leggings?|running|palestra|sportiv)/i],
  [1,/(t-?shirt|\btee\b|felpa|hoodie|jeans|sneaker|canotta|shorts|bermuda|sandal|infradito|cappellino|jogger|denim|sweat|piumino|parka|bomber|zaino|cargo)/i],
  [2,/(camicia|maglion|dolcevita|cardigan|chino|polo|mocassin|stivalett|trench|gonna|maglia|ballerin|loafer|pullover|giacca|stivali|cintura|sciarpa|foulard)/i],
  [3,/(blazer|completo|tailleur|abito|tacc|d[eé]collet|sartorial|seta|raso|smoking|cappotto|pochette|cravatta|perle|gioiell|orecchin|collana|pump)/i],
];
const CAT_FORM = {top:1.3,maglieria:1.8,pantaloni:1.5,gonne:2,vestiti:2,capispalla:2,scarpe:1.5,borse:2,accessori:1.6};
const OCC_FORM = {sport:0,casual:1,lavoro:2.2,serata:2.6,elegante:3};
const FORM_LABELS = [['','Automatica'],['0','Sportivo'],['1','Casual'],['2','Smart'],['3','Elegante']];
const _formCache = new WeakMap();
function formality(it){
  if(_formCache.has(it)) return _formCache.get(it);
  let f;
  if(it.formality!==undefined && it.formality!=='' && it.formality!==null) f=+it.formality;
  else {
    const ti=typeInfo(it);
    if(ti) f=ti.form;
    else {
      const txt=(it.name||'')+' '+(it.notes||''); const lv=[];
      for(const [l,re] of FORM_KW) if(re.test(txt)) lv.push(l);
      f = lv.length ? lv.reduce((a,b)=>a+b,0)/lv.length : (CAT_FORM[it.cat] ?? 1.5);
    }
    const fa={baggy:-0.4, balloon:-0.2, palazzo:0.2, skinny:-0.05, oversize:-0.15, boxy:-0.1, crop:-0.1}[fitOf(it)]; if(fa) f+=fa;
    const oc=(it.occasions||[]).map(o=>OCC_FORM[o]).filter(x=>x!=null);
    if(oc.length) f = f*0.6 + (oc.reduce((a,b)=>a+b,0)/oc.length)*0.4;
  }
  _formCache.set(it,f); return f;
}
const WARM_N = new Set(['beige','marrone','panna','tortora','cachi','cammello','cioccolato','oro']); const COOL_N = new Set(['nero','grigio','navy','denim','antracite','grigiochiaro','denimchiaro','argento']);
const GOOD_PAIRS = [['navy','rosso'],['navy','bordeaux'],['beige','bordeaux'],['marrone','azzurro'],['beige','oliva'],['marrone','oliva'],['beige','verde'],['grigio','rosa'],['denim','giallo'],['bianco','blu'],['navy','giallo'],['nero','rosso'],['beige','blu'],['grigio','giallo'],['marrone','arancione'],['denim','rosso'],['bianco','verde'],['nero','rosa'],['beige','azzurro'],['navy','azzurro'],['grigio','bordeaux'],['denim','bordeaux'],['bianco','rosso'],['nero','bordeaux'],['beige','rosa'],['marrone','bordeaux']];
const GOOD_ACCENTS = [['blu','arancione'],['rosa','rosso'],['verde','rosa'],['blu','giallo'],['viola','giallo'],['azzurro','rosa'],['bordeaux','rosa'],['verde','blu'],['oliva','arancione']];
const pairIn = (list,a,b) => list.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
const famOf = c => COLOR_FAMILY[c]||c;
const mainC = it => (it.colors||[])[0]||null;
function lumOf(c){ const k=COL[c]; if(!k) return .5; const h=k.hex; const v=i=>parseInt(h.slice(i,i+2),16)/255; return 0.2126*v(1)+0.7152*v(3)+0.0722*v(5); }
const lowerLabel = c => COL[c] ? COL[c].label.toLowerCase() : c;
const isJeans = it => ['jeans','jeansgonna'].includes(typeOf(it)) || /jeans|denim/i.test(it.name||'') || (it.cat==='pantaloni' && ['denim','denimchiaro'].includes(mainC(it)));

const PARIGINO = () => G()==='uomo' ? 'Classico con accento di colore' : 'Chic alla parigina';
const STYLES = () => [
  ['','Qualsiasi stile'],['minimal','Minimal'],['classico','Classico / old money'],['casual','Casual curato'],
  ['parigino',PARIGINO()],['tono','Tono su tono'],['colore','Con un tocco di colore'],['smart','Smart casual'],['street','Streetwear / sportivo'],['sera','Da sera'],
];
const genderWord = () => G()==='uomo' ? 'uomo' : G()==='donna' ? 'donna' : '';

function styleScore(items, ctx, W){
  let s=0; const why=[];
  const cols=items.map(mainC).filter(Boolean);
  const accents=[...new Set(cols.filter(c=>COL[c]&&!COL[c].neutral&&c!=='fantasia').map(famOf))];
  const patterns=cols.filter(c=>c==='fantasia').length;
  const neutrals=cols.filter(c=>COL[c]&&COL[c].neutral);
  const hasWarm=neutrals.some(c=>WARM_N.has(c)), hasCool=neutrals.some(c=>COOL_N.has(c));
  // Palette
  if(!accents.length && !patterns){
    if(!(hasWarm&&hasCool)){ s+=3; why.push(hasWarm?'Palette neutra calda, armoniosa':'Palette neutra e pulita'); }
    else if(neutrals.includes('navy')||neutrals.includes('denim')){ s+=2.8; why.push('Neutri caldi e blu: una coppia classica'); }
    else { s+=2.2; why.push('Base tutta neutra, facile da portare'); }
  } else if(accents.length===1 && !patterns){
    s+=3.2; const acc=accents[0];
    const accItems=items.filter(i=>{ const c=mainC(i); return c && famOf(c)===acc; });
    const accC=mainC(accItems[0]);
    if(accItems.length===1){ s+=0.7; why.push(`Base neutra con un solo tocco di ${lowerLabel(accC)}`); }
    else if(accItems.length===2){ s+=0.3; why.push(`Il ${lowerLabel(accC)} ripreso in due capi crea un filo conduttore`); }
    else s-=0.8;
    const partner=[...new Set(neutrals)].find(n=>pairIn(GOOD_PAIRS,n,accC)||pairIn(GOOD_PAIRS,n,acc)||pairIn(GOOD_PAIRS,famOf(n),acc));
    if(partner){ s+=0.8; why.push(`${COL[partner].label} e ${lowerLabel(accC)}: abbinamento intramontabile`); }
  } else if(accents.length===2 && !patterns){
    if(pairIn(GOOD_ACCENTS,accents[0],accents[1])){ s+=2.4; why.push(`${COL[accents[0]].label} e ${lowerLabel(accents[1])} si esaltano a vicenda`); }
    else s-=1.5;
  } else if(accents.length>2) s-=3.5;
  if(patterns===1){ if(!accents.length){ s+=2.8; why.push('Una sola fantasia, il resto neutro: è lei la protagonista'); } else s-=0.6; }
  if(patterns>1) s-=4.5;
  if(cols.includes('nero')&&cols.includes('marrone')) s-=0.5;
  if(cols.includes('nero')&&cols.includes('navy')) s-=0.4;
  // Tono su tono
  const famSet=new Set(cols.map(famOf));
  const tonal = cols.length>=3 && (famSet.size===1 || (famSet.size===2 && [...famSet].every(c=>WARM_N.has(c)||c==='bianco')));
  if(tonal){ s+=1.2; why.push('Effetto tono su tono, molto ricercato'); }
  // Contrasto sopra/sotto
  const top=items.find(i=>i.cat==='top'||i.cat==='maglieria'), bot=items.find(i=>i.cat==='pantaloni'||i.cat==='gonne');
  if(top&&bot&&mainC(top)&&mainC(bot)){
    const dl=Math.abs(lumOf(mainC(top))-lumOf(mainC(bot)));
    if(dl>0.35 && !tonal){ s+=0.7; why.push('Bel contrasto chiaro/scuro tra sopra e sotto'); }
    else if(dl<0.06 && famOf(mainC(top))!==famOf(mainC(bot))) s-=0.6;
  }
  // Proporzioni: sopra ampio con sotto stretto, o sopra corto/aderente con sotto ampio
  { const upper=items.filter(i=>['top','maglieria'].includes(i.cat)).map(fitOf).filter(Boolean), lower=items.filter(i=>i.cat==='pantaloni').map(fitOf).filter(Boolean)[0];
    const wideUp=upper.some(f=>['oversize','boxy','comoda'].includes(f)), slimUp=upper.some(f=>['aderente','crop'].includes(f));
    const wideLow=['larghi','baggy','balloon','palazzo','zampa'].includes(lower), slimLow=['skinny','slim','tapered'].includes(lower);
    if(wideUp && slimLow){ s+=0.6; why.push('Sopra ampio e sotto stretto: proporzioni bilanciate'); }
    else if(slimUp && wideLow){ s+=0.6; why.push('Sopra corto o aderente con un pantalone ampio: silhouette slanciata'); }
    else if(upper.includes('oversize') && ['baggy','balloon'].includes(lower)) { s+=0.1; why.push('Tutto ampio: look streetwear'); } }
  // Scarpe, borsa, cintura di colore
  const sh=items.find(i=>i.cat==='scarpe'), bg=items.find(i=>i.cat==='borse');
  if(sh&&bg&&mainC(sh)&&mainC(sh)===mainC(bg)){ s+=0.8; why.push('Scarpe e borsa dello stesso colore'); }
  if(sh&&mainC(sh)&&!COL[mainC(sh)]?.neutral&&accents.length===1&&famOf(mainC(sh))===accents[0]&&items.filter(i=>famOf(mainC(i)||'')===accents[0]).length===2) { s+=0.3; }
  // Strati (autunno/inverno)
  const base=items.find(i=>i.cat==='top'), knit=items.find(i=>i.cat==='maglieria');
  if(base && knit){
    const bt=typeOf(base), kt=typeOf(knit);
    if(kt==='dolcevita') s-=1.6;
    else if(bt==='camicia' && ['maglione','cardigan','gilet','felpa'].includes(kt)){ s+=0.9; why.push(`Camicia sotto ${kt==='cardigan'?'il cardigan':kt==='gilet'?'il gilet':kt==='felpa'?'la felpa':'il maglione'}: strati da manuale`); }
    else if(['tshirt','longsleeve'].includes(bt) && ['hoodie','felpa','felpazip','cardigan','maglione'].includes(kt)){ s+=0.4; why.push('T-shirt sotto la maglia: strati comodi'); }
    else if(['canotta','top','body'].includes(bt) && kt!=='cardigan') s-=0.6;
    if(base && knit && mainC(base) && mainC(knit) && mainC(base)===mainC(knit) && !COL[mainC(base)].neutral) s-=0.4;
  }
  // Palette di stagione
  const RU=ctx.season && SEASON_RULES[ctx.season];
  if(RU && cols.length>=2){
    const inPal=cols.filter(c=>RU.palette.includes(c)||RU.palette.includes(famOf(c))||c==='fantasia').length/cols.length;
    if(inPal>=0.75){ s+=0.6; why.push(RU.pal); }
    if(ctx.season==='estate' && cols.filter(c=>c==='nero').length/cols.length>=0.5) s-=0.6;
    if(ctx.season==='inverno' && cols.filter(c=>['giallo','arancione','rosa','azzurro'].includes(c)).length>=2) s-=0.4;
  }
  // Eleganza coerente
  const fs=items.map(formality); const spread=Math.max(...fs)-Math.min(...fs); const avg=fs.reduce((a,b)=>a+b,0)/fs.length;
  const tailored=items.some(i=>(['blazer','giacca','cappotto','trench'].includes(typeOf(i)) || /blazer|giacca|cappotto|trench/i.test(i.name||'')) && formality(i)>=2.2);
  const smartCasual = tailored && items.some(isJeans);
  if(smartCasual){ s+=1.4; why.push('Pezzo sartoriale con il denim: lo smart casual più amato'); }
  if(spread<=1.1){ s+=1.1; if(!smartCasual) why.push('Capi dello stesso livello di eleganza'); }
  else if(spread>1.8 && !smartCasual) s-=(spread-1.8)*2.2;
  else if(spread>2.4) s-=(spread-2.4)*2;
  if(ctx.target!=null){ const d=Math.abs(avg-ctx.target); s-=d*(ctx.occasion?2.2:1.3); if(d<0.45) why.push('Giusto per l\'occasione'); }
  // Freschezza: non ripetere quello che hai messo da poco
  const today=todayStr(); let recent=0, fresh=null;
  for(const it of items){ const w=W[it.id]; if(w && w.last && daysBetween(w.last,today)<=1) recent++; if(!w && !fresh) fresh=it; }
  s-=recent*0.9;
  if(fresh && items.length>=3){ s+=0.25; }
  return {s, why, avg, accents, patterns, tonal, smartCasual, fresh, cols, neutrals};
}
function archetypeOf(items, sc){
  const nameStr=items.map(i=>i.name).join(' ');
  if(sc.avg>=2.5 && (items.some(i=>i.cat==='vestiti')||/tacc|seta|raso|d[eé]collet/i.test(nameStr))) return ['sera','Look da sera','outfit elegante sera'];
  if(sc.smartCasual) return ['smart','Smart casual','outfit smart casual blazer jeans'];
  const tps=items.map(typeOf);
  if(tps.some(t=>['hoodie','felpa','felpazip','bomber','cargo','tuta'].includes(t)) && tps.some(t=>['sneakers','sportive'].includes(t)) && sc.avg<1.35) return ['street','Streetwear','outfit streetwear'];
  if(sc.avg<0.8) return ['street','Sportivo comodo','outfit athleisure'];
  if(sc.patterns===1&&!sc.accents.length) return ['minimal','Fantasia protagonista','outfit fantasia neutri'];
  if(sc.tonal) return ['tono','Tono su tono','outfit tono su tono'];
  if(!sc.accents.length){
    const blackish=sc.cols.filter(c=>c==='nero').length;
    if(blackish>=Math.max(2,sc.cols.length-1)) return ['minimal','Total black','outfit total black'];
    if(sc.neutrals.some(c=>WARM_N.has(c)) && sc.avg>=1.8) return ['classico','Classico senza tempo','outfit old money'];
    if(sc.avg<1.5) return ['casual','Casual curato','outfit casual chic'];
    return ['minimal','Minimal chic','outfit minimal chic'];
  }
  if(sc.accents.length===1){
    const acc=sc.accents[0];
    if(['rosso','bordeaux'].includes(acc) || sc.cols.includes('bordeaux')) { if(sc.neutrals.some(c=>['nero','navy','bianco','denim'].includes(c))) return ['parigino',PARIGINO(),G()==='uomo'?'outfit classico elegante':'outfit chic parigino']; }
    const c=sc.cols.find(x=>famOf(x)===acc)||acc;
    return ['colore','Neutri e un tocco di '+lowerLabel(c),'outfit neutro tocco di '+lowerLabel(c)];
  }
  return ['colore','Colori a contrasto','outfit color block'];
}
function pinterestURL(items, arch){
  const key=sortByCat(items.map(i=>i.id)).map(id=>S.items[id]).filter(i=>!['borse','accessori'].includes(i.cat)).slice(0,3)
    .map(i=>{ const n=(i.name||'').toLowerCase(); const c=mainC(i); if(!c||c==='fantasia') return n; const w=lowerLabel(c).split(' ')[0]; const stem=w.slice(0,Math.max(3,w.length-1)); return n.includes(stem) ? n : n+' '+lowerLabel(c); });
  const q=arch[2].replace(/^outfit/,'outfit '+genderWord()).replace(/\s+/g,' ');
  return 'https://www.pinterest.it/search/pins/?q='+encodeURIComponent((q+' '+key.slice(0,2).join(' ')).trim());
}
/* Proposte dello stilista: prima i migliori abbinamenti, poi a rotazione finché ogni capo adatto alla stagione è stato usato */
function prioBonus(it, prio){
  const u=usoOf(it);
  if(prio==='poco') return u==='mai'?1.1 : u==='qualche'?0.5 : 0;
  if(prio==='spesso') return u==='spesso'?1.1 : u==='qualche'?0.35 : 0;
  return 0;
}
function curate(){
  const d=UI.dress, base=dressCtx(); const W=wearIndex(); const RU=SEASON_RULES[base.season];
  const ctx=Object.assign({}, base, {target: base.occasion? OCC_FORM[base.occasion] : (d.style==='sera'?2.6: d.style==='classico'?2.1 : d.style==='casual'?1.1 : null)});
  const prio=d.prio||'';
  const locked=id=>d.locks[id]&&d.slots[id]&&S.items[d.slots[id]];
  const explicitOnly=p=>p.filter(i=>i.seasons&&i.seasons.length);
  const pools=Object.fromEntries(SLOTS.map(s=>{ let p=poolFor(s,ctx); if(locked(s.id)) p=[S.items[d.slots[s.id]]]; return [s.id,p]; }));
  // in estate maglie e giacche si usano solo se le hai segnate tu per l'estate
  if(RU.maglia==='no' && !locked('maglia')) pools.maglia=explicitOnly(pools.maglia);
  if(RU.outer==='no' && !locked('capispalla')) pools.capispalla=explicitOnly(pools.capispalla);
  const lockedSep = locked('top')||locked('sotto')||locked('maglia');
  const lockedDress = locked('vestito');
  let uppers=[];
  if(locked('maglia')) uppers=pools.maglia.map(x=>[x]);
  else if(locked('top')) uppers=pools.top.map(x=>[x]);
  else if(RU.maglia==='si') uppers=(pools.maglia.length?pools.maglia:pools.top).map(x=>[x]);
  else if(RU.base==='si') uppers=(pools.top.length?pools.top:pools.maglia).map(x=>[x]);
  else uppers=[...pools.top.map(x=>[x]), ...pools.maglia.map(x=>[x])];
  const cores=[];
  if(!lockedDress) for(const u of uppers) for(const b of pools.sotto) cores.push([...u,b]);
  if(!lockedSep) for(const v of pools.vestito) cores.push([v]);
  const evalSet = items => { const sc=styleScore(items,ctx,W); const ar=archetypeOf(items,sc); let s=sc.s; if(d.style && ar[0]===d.style) s+=2.5; if(prio) s+=items.reduce((a,i)=>a+prioBonus(i,prio),0)/Math.max(1,items.length)*1.6; return {s,sc,ar}; };
  const keyOf=items=>items.filter(i=>['top','maglieria','pantaloni','gonne','vestiti'].includes(i.cat)).map(i=>i.id).sort().join('|');
  const scored=cores.map(items=>({items, ...evalSet(items), key:keyOf(items)}));
  if(!scored.length){ d._cov=null; return []; }
  const topS=Math.max(...scored.map(c=>c.s));
  const bestFor={}; for(const c of scored) for(const i of c.items) bestFor[i.id]=Math.max(bestFor[i.id]??-1e9, c.s);
  // capi da far girare: tutti quelli che la stagione permette in un outfit
  const coverSlots=['top','maglia','sotto','vestito','scarpe','capispalla','borsa','accessorio'];
  const want=new Set(); for(const sid of coverSlots) for(const i of pools[sid]) want.add(i.id);
  const U={}; const B=1.6, P=0.55;
  const bonus=i=> U[i.id] ? -P*U[i.id] : (want.has(i.id)?B:0);
  const mode=r=> r==='si'?'required': r==='opt'?'optional':'no';
  const addSlot=(c, slotId, md)=>{
    const pool=pools[slotId]; if(!pool.length || md==='no') return c;
    if(c.items.some(i=>SLOTS.find(s=>s.id===slotId).cats.includes(i.cat))) return c;
    if(locked(slotId)) md='required';
    let best=null, bestK=-1e9;
    for(const it of pool){ const items=[...c.items,it]; const r=evalSet(items); const k=r.s+bonus(it); if(k>bestK){ bestK=k; best={...c, items,...r}; } }
    if(md==='required') return best;
    const tolerance = slotId==='borsa'?(G()==='uomo'?-0.1:0.35) : slotId==='capispalla'?0.2 : slotId==='top'?0.1 : -0.25;
    return bestK >= c.s - tolerance ? best : c;
  };
  const complete=c=>{
    let x=c; const isDress=x.items.some(i=>i.cat==='vestiti');
    if(!isDress){
      const magliaMode = locked('maglia')?'required' : RU.maglia==='si'?'required' : RU.maglia==='opt'?'optional' : (pools.maglia.length?'optional':'no');
      x=addSlot(x,'maglia', magliaMode);
      x=addSlot(x,'top', x.items.some(i=>i.cat==='maglieria') ? 'optional' : 'required');
    }
    if(pools.scarpe.length) x=addSlot(x,'scarpe','required');
    x=addSlot(x,'capispalla', locked('capispalla')?'required': RU.outer==='no' ? (pools.capispalla.length?'optional':'no') : mode(RU.outer));
    x=addSlot(x,'borsa','optional');
    x=addSlot(x,'accessorio','optional');
    return x;
  };
  const eligible=c=> c.s>=topS-3 || c.items.some(i=>c.s>=bestFor[i.id]-1e-6);
  const usedKeys=new Set(); const out=[]; const MAXN=40;
  const covered=()=>[...want].every(id=>U[id]);
  while(out.length<MAXN){
    if(out.length>=12 && covered()) break;
    let pick=null, pk=-1e9;
    for(const c of scored){ if(usedKeys.has(c.key) || !eligible(c)) continue; const k=c.s + c.items.reduce((a,i)=>a+bonus(i),0)/c.items.length*2; if(k>pk){ pk=k; pick=c; } }
    if(!pick) break;
    usedKeys.add(pick.key);
    const x=complete(pick);
    const ids=new Set(x.items.map(i=>i.id));
    const tooClose=out.some(o=>{ const sh=o.items.filter(i=>ids.has(i.id)).length; return sh>=Math.max(o.items.length,ids.size)-1 && sh>=3; });
    const bringsNew=x.items.some(i=>!U[i.id] && want.has(i.id));
    if(tooClose && !bringsNew) continue;
    out.push(x); for(const i of x.items) U[i.id]=(U[i.id]||0)+1;
  }
  // capi rimasti fuori: costruisco apposta l'outfit migliore che li contiene
  const slotOf=it=>SLOTS.find(sl=>pools[sl.id].includes(it));
  const coreOrder=scored.slice().sort((a,b)=>b.s-a.s);
  for(const id of [...want]){
    if(U[id] || out.length>=MAXN+12) continue;
    const it=S.items[id]; const sl=slotOf(it); if(!sl) continue;
    let best=null;
    for(const c of coreOrder.slice(0,25)){
      if(c.items.some(i=>i.cat==='vestiti') && ['top','maglia','sotto'].includes(sl.id)) continue;
      if(sl.id==='vestito') break;
      if(c.items.some(i=>sl.cats.includes(i.cat))) continue;
      const items=[...c.items,it]; const r=evalSet(items); const x=complete({items,...r,key:c.key});
      if(!best||x.s>best.s) best=x;
    }
    if(best && best.s>=topS-4.5){ out.push(best); for(const i of best.items) U[i.id]=(U[i.id]||0)+1; }
  }
  // armadio piccolo: qualche proposta in più, se è ancora valida
  if(out.length<8){ for(const c of scored.slice().sort((a,b)=>b.s-a.s)){ if(out.length>=8) break; if(usedKeys.has(c.key) || c.s<topS-4.5) continue; usedKeys.add(c.key); const x=complete(c); const ids=new Set(x.items.map(i=>i.id)); if(out.some(o=>{ const sh=o.items.filter(i=>ids.has(i.id)).length; return sh>=Math.max(o.items.length,ids.size)-1 && sh>=3; })) continue; out.push(x); } }
  out.sort((a,b)=>b.s-a.s);
  const missing=[...want].filter(id=>!U[id]).map(id=>S.items[id]);
  d._cov={total:want.size, used:want.size-missing.length, missing};
  return out.map(c=>({ ids:sortByCat(c.items.map(i=>i.id)), score:c.s, why:[...new Set(c.sc.why)].slice(0,4), arch:c.ar, fresh:c.sc.fresh, pin:pinterestURL(c.items,c.ar) }));
}
function starsFor(s){ const n=Math.max(1,Math.min(5,Math.round(s/1.75))); return '●'.repeat(n)+'○'.repeat(5-n); }

function mescolaBody(){
  const d=UI.dress, ctx=dressCtx();
  if(d.pending || !Object.keys(d.slots).length){ d.pending=false; generateDress(); }
  const ids=Object.values(d.slots).filter(id=>S.items[id]);

function outfitBoard(items, st){
  const W=1536, H=1536, P=40; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  const withPic=items.filter(it=>{ const s=st.src[it.id]; return s && s.M && !s.sil; });
  const groups=[ ['capispalla','maglieria','top','vestiti'], ['pantaloni','gonne'], ['scarpe','borse','accessori'] ].map(cs=>withPic.filter(it=>cs.includes(it.cat))).filter(g=>g.length);
  const wts=groups.map(g=>['scarpe','borse','accessori'].includes(g[0].cat)?0.55:1.15); const tw=wts.reduce((a,b)=>a+b,0)||1;
  let y=P; groups.forEach((g,gi)=>{ const rh=(H-2*P)*wts[gi]/tw; const cw=(W-2*P)/g.length;
    g.forEach((it,k)=>{ const cv=st.src[it.id].M.canvas; const sc=Math.min((cw-30)/cv.width,(rh-30)/cv.height); const w=cv.width*sc, h=cv.height*sc;
      const cx=P+cw*k+cw/2, cy=y+rh/2; x.save(); x.shadowColor='rgba(0,0,0,.15)'; x.shadowBlur=18; x.shadowOffsetY=6; x.drawImage(cv,cx-w/2,cy-h/2,w,h); x.restore(); });
    y+=rh; });
  return c;
}

Deve indossare esattamente i capi dell'immagine allegata, identici nei colori, nei tessuti, nelle forme, nelle stampe e nei loghi:

async function renderTryOn(st){
  const W=1200, H=2000, k=2; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');

  x.drawImage(await tlLoad(tlSvgUrl(mqSVG(st.L,st.tone,'body').replace('<svg ','<svg width="1200" height="2000" '))),0,0,W,H);
  for(const L of st.layers){
    if(L.head){ x.drawImage(await tlLoad(tlSvgUrl(mqSVG(st.L,st.tone,'head').replace('<svg ','<svg width="1200" height="2000" '))),0,0,W,H); continue; }

    let im; try{ im=await tlLoad(L.url); }catch(e){ continue; }
    x.save(); x.translate((L.x+L.w/2)*k,(L.y+L.h/2)*k); x.rotate(L.rot*Math.PI/180); if(L.flip) x.scale(-1,1);
    if(L.mask){ const tc=document.createElement('canvas'); tc.width=Math.max(1,Math.round(L.w*k)); tc.height=Math.max(1,Math.round(L.h*k)); const tx=tc.getContext('2d'); tx.drawImage(im,0,0,tc.width,tc.height); tx.globalCompositeOperation='destination-in'; try{ tx.drawImage(await tlLoad(L.mask),0,0,tc.width,tc.height); }catch(e){} im=tc; }

    x.drawImage(im,-L.w*k/2,-L.h*k/2,L.w*k,L.h*k); x.restore();

  return canvasToBlob(c,'image/png');
}

  const body=()=>{ const b=$('#d-body',m);

      $$('[data-oid]',b).forEach(x=>x.onclick=()=>{ const o=S.outfits[x.dataset.oid]; l.outfitId=o.id; sel.clear(); o.items.forEach(i=>sel.add(i)); prev(); body(); });

/* ================= VISTA: STATISTICHE ================= */
function viewStatistiche(){
  const W=wearIndex(), t=todayStr(); const act=activeItems();
  if(!act.length) return `${demoBanner()}<div class="view-head"><div><h2>Statistiche</h2></div></div><div class="empty"><h3>Ancora niente da contare</h3><p>Aggiungi capi e registra cosa indossi: qui vedrai quanto ti costa ogni uscita e cosa dimentichi nell'armadio.</p><button class="btn accent" data-act="add-item">Aggiungi un capo</button></div>`;
  const value=act.reduce((s,i)=>s+(num(i.price)||0),0);
  const priced=act.filter(i=>num(i.price)!=null && W[i.id]);
  const avgCpw = priced.length ? priced.reduce((s,i)=>s+num(i.price),0)/priced.reduce((s,i)=>s+W[i.id].count,0) : null;
  const used90=act.filter(i=>W[i.id] && daysBetween(W[i.id].last,t)<=90).length;
  const rot=Math.round(used90/act.length*100);

  const top=act.filter(i=>W[i.id]).sort((a,b)=>W[b.id].count-W[a.id].count).slice(0,6);

  const li=(i,right)=>`<div class="li"><button class="thumb" data-iid="${esc(i.id)}" aria-label="Apri ${esc(i.name)}">${itemVisual(i)}</button><div class="t"><b>${esc(i.name)}</b><span>${esc(typeLabel(i))}${i.brand?' · '+esc(i.brand):''}</span></div><div class="r">${right}</div></div>`;
  return `${demoBanner()}<div class="view-head"><div><h2>Statistiche</h2><p>Quanto usi davvero quello che hai.</p></div></div>
  <div class="tiles">
    <div class="tile"><span>Capi nell'armadio</span><b>${act.length}</b><p>valore ${money(value,0)}</p></div>
    <div class="tile"><span>Costo medio per uso</span><b>${avgCpw!=null?money(avgCpw):'—'}</b><p>sui capi con prezzo indossati</p></div>
    <div class="tile"><span>Rotazione 90 giorni</span><b>${rot}%</b><p>${used90} capi su ${act.length} usati di recente</p></div>
    <div class="tile"><span>Giorni registrati</span><b>${wornDays.length}</b><p>${Object.keys(S.outfits).length} outfit salvati</p></div>
  </div>
  <div class="cols2">
    <div class="section"><h3>I più indossati</h3>${top.length?`<div class="list">${top.map(i=>li(i,`<div class="hbar" style="grid-template-columns:90px 34px;padding:0"><div class="tr"><div class="fl" style="width:${Math.round(W[i.id].count/topMax*100)}%"></div></div><span class="v">${W[i.id].count}</span></div>`)).join('')}</div>`:'<p class="muted">Registra qualche giornata nel calendario.</p>'}</div>
    <div class="section"><h3>Gli acquisti più ripagati</h3>${best.length?`<div class="list">${best.map(i=>li(i,`<b class="num">${money(cpw(i,W[i.id]))}</b><br><span class="small muted">${W[i.id].count} usi · ${money(num(i.price),0)}</span>`)).join('')}</div>`:'<p class="muted">Inserisci il prezzo dei capi per vedere il costo per uso.</p>'}</div>
  </div>
  <div class="section"><div class="section-head"><h3>Dimenticati nell'armadio</h3><span class="small muted">mai indossati o fermi da oltre 60 giorni</span></div>
    ${forgotten.length?`<div class="list">${forgotten.map(i=>li(i,`<span class="small muted">${W[i.id]?'ultimo uso '+agoText(W[i.id].last):'mai indossato'}</span><br><span class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn sm" data-match="${esc(i.id)}">Abbinalo</button>${i.status!=='davendere'?`<button class="btn sm ghost" data-sell="${esc(i.id)}">Da vendere</button>`:''}</span>`)).join('')}</div>`:'<p class="muted">Ottimo: stai usando tutto il tuo armadio.</p>'}</div>
  <div class="cols2">
    <div class="section"><h3>Per categoria</h3>${byCat.map(([c,n])=>`<div class="hbar" title="${esc(c.label)}: ${n}"><span class="lb">${esc(c.label)}</span><div class="tr"><div class="fl" style="width:${Math.round(n/maxCat*100)}%"></div></div><span class="v">${n}</span></div>`).join('')}</div>
    <div class="section"><h3>La tua palette</h3>${cols.length?`<div class="colstrip">${cols.map(([c,n])=>`<div title="${esc(COL[c].label)}: ${n}" style="flex:${n};background:${c==='fantasia'?'conic-gradient(#7a50b0,#f1a7c1,#efc83b,#2f8a4d,#7a50b0)':COL[c].hex}"></div>`).join('')}</div>
      <div class="legend">${cols.map(([c,n])=>`<span>${colorSw(c).replace('class="sw"','')}${esc(COL[c].label)} <b class="num">${Math.round(n/colTot*100)}%</b></span>`).join('')}</div>`:'<p class="muted">Aggiungi i colori ai capi.</p>'}</div>
  </div>
  <div class="section"><h3>Giorni registrati per mese</h3>
    <div class="months">${months.map(([k,l,n])=>`<div class="mc" title="${l}: ${n} giorni">${n?`<span class="mv">${n}</span>`:''}<div class="mb" style="height:${Math.round(n/maxM*100)}%"></div></div>`).join('')}</div>
    <div class="mlabels">${months.map(([k,l])=>`<span>${l}</span>`).join('')}</div></div>`;
}

/* ================= VISTA: VALIGIE ================= */
function tripStats(tr){ const all=(tr.items||[]).length+(tr.extras||[]).length; const done=(tr.packed||[]).filter(i=>(tr.items||[]).includes(i)).length+(tr.extras||[]).filter(x=>x.done).length; return {all,done}; }
function viewValigie(){
  const trips=Object.values(S.trips).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')));
  const head=`${demoBanner()}<div class="view-head"><div><h2>Valigie</h2><p>Liste per i viaggi, con i capi presi dal tuo armadio.</p></div><button class="btn accent" data-act="new-trip">+ Nuovo viaggio</button></div>`;
  if(!trips.length) return head+`<div class="empty"><h3>Nessun viaggio in programma</h3><p>Crea una valigia, aggiungi capi e outfit e spunta quello che hai già messo dentro.</p><button class="btn accent" data-act="new-trip">Prepara una valigia</button></div>`;
  return head+`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${trips.map(tr=>{ const s=tripStats(tr); const days=tr.start&&tr.end?daysBetween(tr.start,tr.end)+1:null; return `<button class="trip" data-trip="${esc(tr.id)}"><h4>${esc(tr.name)}</h4><span class="small muted">${tr.start?fmtDate(tr.start):''}${tr.end?' → '+fmtDate(tr.end):''}${days?` · ${days} ${days===1?'giorno':'giorni'}`:''}</span>${collage((tr.items||[]).slice(0,6))}<div class="prog"><div style="width:${s.all?Math.round(s.done/s.all*100):0}%"></div></div><span class="small num">${s.done}/${s.all} in valigia</span></button>`; }).join('')}</div>`;
}

    <div class="modal-foot">${id?'<button class="btn ghost danger left" id="t-del">Elimina viaggio</button>':''}<button class="btn" data-close>Annulla</button><button class="btn accent" id="t-save">${id?'Salva':'Crea e riempi'}</button></div>`);

function openTrip(id){
  const tr=S.trips[id]; if(!tr) return; tr.items=tr.items||[]; tr.packed=tr.packed||[]; tr.extras=tr.extras||[];
  const days=tr.start&&tr.end?daysBetween(tr.start,tr.end)+1:null;
  const count=cats=>tr.items.filter(i=>S.items[i]&&cats.includes(S.items[i].cat)).length;
  const sugg = days ? `Per ${days} ${days===1?'giorno':'giorni'} ne bastano circa: ${Math.min(days,7)} top (hai ${count(['top','maglieria'])}), ${Math.max(1,Math.ceil(Math.min(days,7)/2.5))} pantaloni o gonne (hai ${count(['pantaloni','gonne'])}), ${days>3?2:1} paia di scarpe (hai ${count(['scarpe'])}).` : '';
  const s=tripStats(tr);

  const m=openModal(`<h3>${esc(tr.name)}</h3><p class="muted" style="margin:-8px 0 12px">${tr.start?fmtDate(tr.start):''}${tr.end?' → '+fmtDate(tr.end):''}</p>
    <div class="prog"><div style="width:${s.all?Math.round(s.done/s.all*100):0}%"></div></div><p class="small num" style="margin:6px 0 14px">${s.done} su ${s.all} già in valigia</p>
    ${sugg?`<div class="banner" style="margin-bottom:14px"><span>${esc(sugg)}</span></div>`:''}
    <div class="row" style="margin-bottom:14px"><button class="btn sm" id="tp-items">+ Capi</button><button class="btn sm" id="tp-outfit">+ Outfit</button><button class="btn sm ghost" id="tp-edit">Modifica viaggio</button></div>
    <div class="cl">${groups.map(([c,ids])=>`<div class="flabel" style="margin-top:10px">${esc(CAT[c].label)}</div>${ids.map(i=>`<label class="${tr.packed.includes(i)?'done':''}"><input type="checkbox" data-pk="${esc(i)}" ${tr.packed.includes(i)?'checked':''}><span class="mth">${itemVisual(S.items[i])}</span><span>${esc(S.items[i].name)}</span></label>`).join('')}`).join('')}
    <div class="flabel" style="margin-top:14px">Altro da portare</div>
    ${tr.extras.map((x,k)=>`<label class="${x.done?'done':''}"><input type="checkbox" data-ex="${k}" ${x.done?'checked':''}><span style="flex:1">${esc(x.t)}</span><button class="btn sm ghost" data-exdel="${k}" aria-label="Togli">×</button></label>`).join('')}
    <form class="row" id="tp-add" style="margin-top:6px"><input class="input grow" id="tp-x" placeholder="Es. caricabatterie, spazzolino, passaporto"><button class="btn sm">Aggiungi</button></form></div>
    <div class="modal-foot"><button class="btn primary" data-close>Fatto</button></div>`,{wide:false});
  const reopen=()=>{ Store.put('trip',tr); closeModal(m); render(); openTrip(id); };
  $$('[data-pk]',m).forEach(c=>c.onchange=()=>{ const i=c.dataset.pk; tr.packed=c.checked?[...new Set([...tr.packed,i])]:tr.packed.filter(x=>x!==i); c.closest('label').classList.toggle('done',c.checked); Store.put('trip',tr); render(); });
  $$('[data-ex]',m).forEach(c=>c.onchange=()=>{ tr.extras[+c.dataset.ex].done=c.checked; c.closest('label').classList.toggle('done',c.checked); Store.put('trip',tr); render(); });
  $$('[data-exdel]',m).forEach(b=>b.onclick=e=>{ e.preventDefault(); tr.extras.splice(+b.dataset.exdel,1); reopen(); });
  $('#tp-add',m).onsubmit=e=>{ e.preventDefault(); const v=$('#tp-x',m).value.trim(); if(!v) return; tr.extras.push({t:v,done:false}); reopen(); };
  $('#tp-edit',m).onclick=()=>{ closeModal(m); openTripForm(id); };
  $('#tp-items',m).onclick=()=>{ const sel=new Set(tr.items); const p=openModal(`<h3>Capi per ${esc(tr.name)}</h3><div id="tpp"></div><div class="modal-foot"><button class="btn" data-close>Annulla</button><button class="btn accent" id="tpp-ok">Fatto</button></div>`,{wide:true}); mountPicker($('#tpp',p),sel); $('#tpp-ok',p).onclick=()=>{ tr.items=[...sel]; tr.packed=tr.packed.filter(i=>sel.has(i)); closeModal(p); reopen(); }; };
  $('#tp-outfit',m).onclick=()=>{ const outs=Object.values(S.outfits); if(!outs.length){ toast('Non hai ancora outfit salvati.'); return; } const p=openModal(`<h3>Aggiungi un outfit</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${outs.map(o=>`<button class="ocard" data-o="${esc(o.id)}">${collage(o.items)}<h4 class="small">${esc(o.name)}</h4></button>`).join('')}</div>`,{wide:true}); $$('[data-o]',p).forEach(b=>b.onclick=()=>{ tr.items=[...new Set([...tr.items,...S.outfits[b.dataset.o].items])]; closeModal(p); reopen(); toast('Capi dell\'outfit aggiunti'); }); };
}

/* ================= VISTA: WISHLIST ================= */
function wishCheck(w){
  const act=activeItems(); const same=act.filter(i=>i.cat===w.cat); const sameCol=same.filter(i=>(i.colors||[]).some(c=>(w.colors||[]).includes(c)));
  const slot=SLOTS.find(s=>s.cats.includes(w.cat)); let partners=0;
  if(slot){ const comp = (slot.id==='top'||slot.id==='maglia')?['pantaloni','gonne']:slot.id==='sotto'?['top','maglieria']:slot.id==='vestito'?['scarpe','capispalla']:['top','maglieria','pantaloni','gonne','vestiti'];
    partners=act.filter(i=>comp.includes(i.cat)).length; }
  return {same:same.length, sameCol:sameCol.length, partners};
}
function viewWishlist(){
  const list=Object.values(S.wish).sort((a,b)=>(b.priority||1)-(a.priority||1)||(b.created||0)-(a.created||0));
  const head=`${demoBanner()}<div class="view-head"><div><h2>Wishlist</h2><p>Prima di comprare, controlla cosa hai già.</p></div><button class="btn accent" data-act="new-wish">+ Desiderio</button></div>`;
  if(!list.length) return head+`<div class="empty"><h3>La lista è vuota</h3><p>Annota quello che ti piacerebbe comprare: ti dico quanti capi simili hai già e con quanti potresti abbinarlo.</p><button class="btn accent" data-act="new-wish">Aggiungi un desiderio</button></div>`;
  const tot=list.reduce((s,w)=>s+(num(w.price)||0),0);
  return head+`<p class="muted num" style="margin-top:-6px">${list.length} desideri · totale ${money(tot,0)}</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${list.map(w=>{ const c=wishCheck(w); const p=num(w.price);
    const verdict = c.sameCol>=2 ? ['warn',`Hai già ${c.sameCol} capi simili`] : c.partners>=3 ? ['good',`Si abbina con ${c.partners} capi che hai`] : ['', c.partners?`Si abbina con ${c.partners} capi`:'Pochi capi con cui abbinarlo'];

function bindImpostazioni(v){
  UPD.paint();
  const g2=$('#upd-go2',v); if(g2) g2.onclick=()=>UPD.apply();
  const cl=$('#set-chlog',v); if(cl) cl.onclick=()=>{ const lines=["Diario dell'Armadio — storico delle versioni","Versione installata: "+APP_VERSION+" ("+APP_DATE+")",""]; for(const [n,t] of CHANGELOG) lines.push("Versione "+n, "  "+t, ""); saveFile('diario-armadio-versioni.txt', new Blob([lines.join('\r\n')],{type:'text/plain'}), 'Storico delle versioni salvato'); };
  const pi=$('#pwa-install',v); if(pi) pi.onclick=()=>PWA.install();
  if($('#pwa-off',v) && navigator.serviceWorker && navigator.serviceWorker.controller) $('#pwa-off',v).textContent='✓ Pronta anche senza internet';
  const at=$('#ai-test',v); if(at) at.onclick=async()=>{ const lg=$('#ai-log',v); at.disabled=true; at.textContent='Verifica in corso… (la prima volta scarica il modello)'; lg.style.display='';
    const tick=setInterval(()=>{ lg.textContent=AI.log.join('\n'); },500);
    AI.note('— inizio verifica · '+location.protocol+'//'+location.host);
    const ok=await aiSelfTest(); clearInterval(tick); lg.textContent=AI.log.join('\n'); at.disabled=false; at.textContent='Verifica il ritaglio preciso'; toast(ok?'Il ritaglio preciso funziona':'Il ritaglio preciso non funziona qui: vedi i dettagli'); };
  $('#set-cur',v).onchange=e=>{ S.settings.currency=e.target.value; if(!isDemo()) R.settings.currency=e.target.value; Store.saveSettings(); render(); toast('Valuta aggiornata'); };
  $('#set-g',v).onclick=e=>{ const b=e.target.closest('[data-g]'); if(!b) return; setGender(b.dataset.g); toast('Stile aggiornato'); };
  // le foto viaggiano dentro il backup, così si possono spostare su un altro dispositivo o sull'app installata
  const IMG_FIELDS={items:['img','imgOrig'],outfits:['photo'],logs:['selfie'],trips:[],wish:['img']};
  const refToData=async ref=>{ if(!ref) return ref; if(ref.d) return {d:ref.d}; const src=imgSrc(ref); if(!src) return null;
    try{ const r=await fetch(src); if(!r.ok) return null; return {d:await blobToDataURL(await r.blob())}; }catch(e){ return null; } };
  $('#set-exp',v).onclick=async()=>{
    const btn=$('#set-exp',v); btn.disabled=true; const total=Object.values(R.items).length; btn.textContent='Preparo il backup…';
    const out={}; let done=0, lost=0;
    for(const key of ['items','outfits','logs','trips','wish']){ out[key]={};
      for(const [id,doc] of Object.entries(R[key]||{})){ const c=clone(doc);
        for(const f of IMG_FIELDS[key]){ if(c[f]){ const d=await refToData(c[f]); if(d) c[f]=d; else { lost++; delete c[f]; } } }
        out[key][id]=c; if(key==='items'){ done++; btn.textContent=`Preparo il backup… ${done}/${total}`; } } }
    const data=JSON.stringify({app:'diario-armadio',version:2,exported:new Date().toISOString(),withPhotos:true,data:Object.assign(out,{settings:R.settings})});
    btn.disabled=false; btn.textContent='Esporta backup';
    const name='armadio-backup-'+todayStr()+'.json';
    const ok=await saveFile(name, new Blob([data],{type:'application/json'}), lost?`Backup salvato con le foto (${lost} non recuperate)`:'Backup salvato, con tutte le foto');
    if(!ok){ const o=$('#set-out',v); o.value=data; o.classList.remove('hidden'); }
  };
  $('#set-imp',v).onclick=()=>$('#set-file',v).click();
  $('#set-file',v).onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ const j=JSON.parse(await f.text()); const d=j.data||j; let n=0, ph=0;
      if(isDemo()) exitDemo(true);
      toast('Importo il backup…');
      for(const [kind,key] of Object.entries(KIND)){ for(const doc of Object.values(d[key]||{})){ if(!(doc&&doc.id&&/^[A-Za-z0-9_\-.~:@+]+$/.test(doc.id))) continue;
        const c=clone(doc);
        for(const fld of (IMG_FIELDS[key]||[])){ const ref=c[fld]; if(!ref) continue;
          if(ref.d && ref.d.startsWith('data:image/')){ try{ const blob=await (await fetch(ref.d)).blob(); c[fld]=await Store.saveImage(blob); ph++; }catch(_){ } }
          else if(ref.a && !imgSrcOk(ref)) delete c[fld]; }
        Store.put(kind,c); n++; } }
      if(d.settings){ R.settings=Object.assign({currency:'EUR'},R.settings,d.settings); S=R; Store.saveSettings(true); applyGender(); }
      render(); toast(`${n} elementi importati${ph?`, ${ph} foto`:''}`);
    }catch(err){ console.warn(err); toast('Il file non è un backup valido.'); } };
  function imgSrcOk(ref){ return Store.mode==='cloud' && !!ref.a; }
  $('#set-wipe',v).onclick=async()=>{ if(!await askConfirm('Cancellare davvero tutto? Non si può annullare.','Cancella tutto')) return;
    for(const [kind,key] of Object.entries(KIND)) for(const id of Object.keys(R[key])){ const doc=R[key][id]; if(doc.img) Store.dropImage(doc.img); if(doc.selfie) Store.dropImage(doc.selfie); Store.remove(kind,id); }
    render(); toast('Tutti i dati sono stati cancellati'); };
}

  const O=outs.map(([n,items,occ],k)=>{ const id='demoo'+k; X.outfits[id]={id,kind:'outfit',name:n,items,occasion:occ,seasons:['autunno'],fav:k===0,created:Date.now()-k*1e6}; return id; });
  for(let k=1;k<=40;k++){ if(k%5===0) continue; const date=addDays(todayStr(),-k); const o=X.outfits[O[k%O.length]]; X.logs[date]={id:date,kind:'log',date,outfitId:o.id,items:o.items.slice(),note:'',selfie:null}; }
  X.logs[addDays(todayStr(),2)]={id:addDays(todayStr(),2),kind:'log',date:addDays(todayStr(),2),outfitId:O[2],items:X.outfits[O[2]].items.slice(),note:'Compleanno di Giulia',selfie:null};
  X.trips.demot={id:'demot',kind:'trip',name:'Weekend a Torino',start:addDays(todayStr(),9),end:addDays(todayStr(),11),items:[I.mag,I.dol,I.jea,I.cap,I.sti,I.sci],packed:[I.mag,I.jea],extras:[{t:'Caricabatterie',done:true},{t:'Ombrello',done:false}],created:Date.now()};
  X.wish.demow={id:'demow',kind:'wish',name:'Blazer grigio',cat:'capispalla',colors:['grigio'],brand:'COS',price:150,url:'',priority:3,notes:'',img:null,created:Date.now()};
  X.wish.demow2={id:'demow2',kind:'wish',name:'Altre sneakers bianche',cat:'scarpe',colors:['bianco'],brand:'',price:95,url:'',priority:1,notes:'',img:null,created:Date.now()-1};
  demoUso(X); return X;
}
function demoUso(X){ const n={}; for(const l of Object.values(X.logs)) for(const i of l.items||[]) n[i]=(n[i]||0)+1; for(const it of Object.values(X.items)){ const c=n[it.id]||0; it.uso = c>=6?'spesso' : c>=1?'qualche' : 'mai'; } }
function enterDemo(){ if(hasReal()){ toast('L\'esempio si apre solo con l\'armadio vuoto.'); return; } D=buildDemo(); S=D; lsSet('armadio-demo-off',''); render(); }
function exitDemo(silent){ S=R; D=null; lsSet('armadio-demo-off','1'); UI.dress.slots={}; UI.dress.locks={}; if(!silent) render(); }

/* ================= ROUTER ================= */
const VIEWS={ armadio:[viewArmadio,bindArmadio], outfit:[viewOutfit,bindOutfit], vestimi:[viewVestimi,bindVestimi], calendario:[viewCalendario,bindCalendario], statistiche:[viewStatistiche,bindStatistiche], valigie:[viewValigie,()=>{}], wishlist:[viewWishlist,()=>{}], impostazioni:[viewImpostazioni,bindImpostazioni] };
function currentView(){ const h=location.hash.replace('#',''); return VIEWS[h]?h:'armadio'; }
let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; render(); }); }
function render(){
  registerCustomColors(); applyGender(); requestAnimationFrame(alignLogo);
  const name=currentView(); const v=$('#view');
  const ae=document.activeElement; const fid=ae&&ae.id&&v.contains(ae)?ae.id:null; const sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  v.innerHTML=VIEWS[name][0](); VIEWS[name][1](v);
  $$('#tabs a, .bottombar a').forEach(a=>a.classList.toggle('on',a.dataset.v===name));
  { const mb=$('#bb-more'); if(mb) mb.classList.toggle('on',['statistiche','valigie','wishlist','impostazioni'].includes(name)); }
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
}
window.addEventListener('hashchange',()=>{ if(currentView()!=='armadio') UI.sel=null; render(); const tab=$('#tabs a.on'); if(tab) tab.scrollIntoView({block:'nearest',inline:'nearest'}); });

/* Azioni globali */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ location.hash=g.dataset.go; return; }
  const day=e.target.closest('[data-day]'); if(day && $('#view').contains(day)){ openDay(day.dataset.day); return; }
  const tr=e.target.closest('[data-trip]'); if(tr){ openTrip(tr.dataset.trip); return; }
  const wi=e.target.closest('[data-wish]'); if(wi){ openWishForm(wi.dataset.wish); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==='add-item'){ if(isDemo()) { exitDemo(); location.hash='armadio'; } openItemForm(null); }
  else if(act==='add-multi'){ $('#file-multi').click(); }
  else if(act==='item'){ if(UI.sel){ UI.sel.has(id)?UI.sel.delete(id):UI.sel.add(id); render(); } else openItem(id); }
  else if(act==='batch-cut'){ batchRecut(); }
  else if(act==='sel-mode'){ UI.sel = UI.sel ? null : new Set(); render(); }
  else if(act==='sel-all'){ $$('#view .tag[data-act=item]').forEach(t=>UI.sel.add(t.dataset.id)); render(); }
  else if(act==='sel-status'){ const st=a.dataset.v; for(const i of UI.sel){ const it=S.items[i]; if(it){ it.status=st; Store.put('item',it); } } const n=UI.sel.size; UI.sel=null; render(); toast(n+(n===1?' capo aggiornato':' capi aggiornati')); }
  else if(act==='sel-delete'){ const ids=[...UI.sel]; askDelete(ids.length).then(r=>{ if(r==='archive'){ ids.forEach(i=>{ const it=S.items[i]; if(it){ it.status='archiviato'; Store.put('item',it); } }); UI.sel=null; render(); toast(ids.length+' capi archiviati'); } else if(r){ ids.forEach(deleteItem); UI.sel=null; render(); toast(ids.length===1?'Capo eliminato':ids.length+' capi eliminati'); } }); }
  else if(act==='outfit') openOutfit(id);
  else if(act==='new-outfit') openOutfitForm(null);
  else if(act==='new-trip') openTripForm(null);
  else if(act==='new-wish') openWishForm(null);
  else if(act==='wear-today') openDay(todayStr());
  else if(act==='enter-demo') enterDemo();
  else if(act==='exit-demo') exitDemo();
});
$('#file-multi').addEventListener('change',e=>{ if(isDemo()) exitDemo(); startAddFromFiles(e.target.files); e.target.value=''; });

Store.init().then(()=>{
  for(const it of Object.values(R.items)){ if(isLegacyAuto(it)){ const c=clone(it); c.name=autoItemName(c); c.autoName=true; Store.put('item',c); } }

/* Salva un file sul dispositivo: dentro Claude passa dal sistema di download di Claude, altrimenti scarica direttamente */
async function saveFile(name, blob, okMsg){
  if(Store.downloads){
    try{ const r=await Store.downloads.save({filename:name, data:blob}); if(!r || r.status!=='delivered') toast(okMsg||'File salvato'); return true; }
    catch(e){ const c=e&&e.code;
      if(c==='declined'){ toast('Salvataggio annullato'); return true; }
      if(c==='rate_limited'){ toast('C\'è già una richiesta di salvataggio aperta: confermala o chiudila e riprova'); return true; }
      if(c==='host_unavailable'){ toast('Qui non posso salvare file: apri l\'app da un browser o dal computer'); return true; }
      console.warn('download', e); }
  }
  const inFrame=(()=>{ try{ return window.top!==window; }catch(_){ return true; } })();
  if(!inFrame){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),30000); toast(okMsg||'File scaricato'); return true; }
  try{ const w=window.open(URL.createObjectURL(blob),'_blank'); if(w){ toast('Si è aperta una scheda con il file: premi Ctrl+S per salvarlo'); return true; } }catch(_){}
  toast('Non riesco a salvare il file da qui.'); return false;
}
